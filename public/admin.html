<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - QR Code Utama Photobooth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Library QRCode JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col items-center justify-center p-6">

    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl p-6 text-center space-y-6">
        <div>
            <span class="text-xs uppercase tracking-widest text-pink-400 font-semibold">Panel Panitia</span>
            <h1 class="text-2xl font-bold mt-1">QR Code Photobooth Utama</h1>
            <p class="text-xs text-gray-400 mt-1">Cetak QR Code ini dan letakkan di meja penerima tamu atau area acara.</p>
        </div>

        <!-- Kotak Tempat QR Code Muncul -->
        <div class="bg-white p-6 rounded-xl inline-block shadow-inner mx-auto">
            <div id="qrcode" class="flex justify-center items-center"></div>
        </div>

        <div class="space-y-2 text-sm">
            <p class="text-gray-300 font-medium">Link Akses Langsung:</p>
            <input type="text" id="appUrl" readonly class="w-full px-3 py-2 bg-gray-800 border border-gray-700 rounded-lg text-center text-xs text-pink-300 select-all">
        </div>

        <div class="pt-2 flex flex-col space-y-3">
            <a href="/admin-gallery.html" target="_blank" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-semibold text-sm transition shadow-lg">
                Buka Galeri Foto Masuk 📸
            </a>
            <button onclick="window.print()" class="w-full bg-gray-800 hover:bg-gray-700 py-2.5 rounded-xl text-xs text-gray-300 transition">
                Cetak Halaman Ini 🖨️
            </button>
        </div>
    </div>

    <script>
        // Otomatis mengambil domain website saat ini (misal: https://xxx.up.railway.app/)
        const currentDomain = window.location.origin;
        const targetUrl = currentDomain + '/index.html';

        // Tampilkan link di text input
        document.getElementById('appUrl').value = targetUrl;

        // Generate QR Code otomatis berdasarkan link domain aktif
        document.getElementById('qrcode').innerHTML = ""; // Bersihkan dulu jika ada
        new QRCode(document.getElementById("qrcode"), {
            text: targetUrl,
            width: 220,
            height: 220,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });
    </script>
</body>
</html>
