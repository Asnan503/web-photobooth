<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Generator Photobooth QR</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">Setup Photobooth Tamu</h1>
        
        <form id="setupForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Nama Objek / Pasangan Pengantin</label>
                <input type="text" id="coupleName" required class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Cth: Rina & Rizky Wedding">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Kode Barcode / ID Meja</label>
                <input type="text" id="barcode" required class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" placeholder="Cth: BRD-VIP-01">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Kuota Ambil Gambar per Tamu</label>
                <input type="number" id="quota" value="3" min="1" max="10" required class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700 transition">Generate QR Code</button>
        </form>

        <div id="resultContainer" class="mt-6 hidden text-center">
            <h3 class="font-semibold text-gray-700 mb-2">Scan QR ini menggunakan HP Tamu:</h3>
            <div id="qrCodeBox" class="flex justify-center mb-4"></div>
            <p id="urlText" class="text-xs text-gray-500 break-all"></p>
        </div>
    </div>

    <script>
        document.getElementById('setupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const coupleName = document.getElementById('coupleName').value;
            const barcode = document.getElementById('barcode').value;
            const quota = document.getElementById('quota').value;

            const res = await fetch('/api/create-session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ coupleName, barcode, quota })
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('resultContainer').classList.remove('hidden');
                document.getElementById('qrCodeBox').innerHTML = `<img src="${data.qrImage}" class="w-48 h-48 border rounded-lg shadow">`;
                document.getElementById('urlText').innerText = data.captureUrl;
            } else {
                alert('Gagal membuat sesi.');
            }
        });
    </script>
</body>
</html>
