<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto Masuk - Photobooth</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-2xl font-bold">📸 Galeri Foto Tamu Undangan</h1>
                <p class="text-xs text-gray-400">Semua foto yang diambil tamu masuk ke server secara otomatis.</p>
            </div>
            <button onclick="loadPhotos()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg text-sm font-semibold transition">
                Refresh Galeri 🔄
            </button>
        </header>

        <div id="photoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <p class="text-gray-500 text-sm col-span-full text-center py-10">Memuat foto...</p>
        </div>
    </div>

    <script>
        async function loadPhotos() {
            try {
                const res = await fetch('/api/admin/photos');
                const result = await res.json();
                
                const grid = document.getElementById('photoGrid');
                grid.innerHTML = '';

                if (result.photos.length === 0) {
                    grid.innerHTML = '<p class="text-gray-500 text-sm col-span-full text-center py-10">Belum ada foto yang diambil tamu.</p>';
                    return;
                }

                result.photos.reverse().forEach(p => {
                    const card = document.createElement('div');
                    card.className = "bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-lg p-3 space-y-2";
                    card.innerHTML = `
                        <img src="${p.url}" class="w-full h-48 object-cover rounded-lg">
                        <div class="text-xs space-y-1">
                            <p class="font-semibold text-pink-400 truncate">${p.guestName}</p>
                            <p class="text-gray-400">Jam: ${p.time}</p>
                        </div>
                        <a href="${p.url}" download class="block text-center bg-green-600 hover:bg-green-500 py-1.5 rounded text-xs font-semibold">Download Foto</a>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            }
        }

        loadPhotos();
        setInterval(loadPhotos, 5000);
    </script>
</body>
</html>
